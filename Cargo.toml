[package]
name = "gb-apu-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "The Game Boy APU transcribed from, and proven equivalent to, gb-apu-python"
license = "MIT"
repository = "https://github.com/alewman/gb-apu-rust"
readme = "README.md"
publish = false

[lib]
name = "gb_apu"

# The core imports nothing by default. The `serde` feature makes `APU` serialisable (save
# states for a host). The ladder's tools (examples/) and the board-stream test read
# gzip JSON and hash samples.
[features]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
bincode = "1"
flate2 = "1"
serde_json = "1"
sha2 = "0.10"

[profile.release]
debug = 1
