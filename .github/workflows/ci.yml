name: CI

# Kept small: main and pull requests only, and a newer run on the same ref cancels the older
# one. `cargo test` is rungs 1 and 3 (the seam tests and the 94 board streams, committed). Rungs
# 2 and 4 need the reference, gb-apu-python, which is private, so they run locally
# (docs/status.md).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
